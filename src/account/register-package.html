<!DOCTYPE html>
<html>
	<head>
		<title>注册包 - Caddy</title>
		{{import "/old/includes/account/head.html"}}
		{{template "account-head"}}
		<script src="/old/resources/js/account/register-package.js{{template "cacheBust"}}"></script>
	</head>
	<body>
		<div class="container">
			{{include "/old/includes/account/nav.html"}}
			<main>
				<section>
					<form action="/api/claim-package">
						<div class="form-fields">
							<div class="field">
								<label>
									<b>包导入路径</b>
									<input type="text" name="package" required>
								</label>
								<div class="description">
									您必须使用<a href="https://github.com/golang/go/wiki/Modules#semantic-import-versioning" target="_blank">语义化导入版本</a>。基本上，这意味着如果您的模块处于v2或更高版本，导入路径必须带有<b>/vN</b>后缀（其中<b>N</b>是主版本号）。
								</div>
							</div>
							<div class="field">
								<label>
									<b>版本</b>
									<input type="text" name="version" placeholder="latest">
								</label>
								<div class="description">
									可选。任何被<a href="https://github.com/golang/go/wiki/Modules#version-selection">Go模块</a>工具识别的版本字符串均可接受。
								</div>
							</div>
							<div class="text-center">
								<button type="submit" id="submit" class="blue">认领包</button>
							</div>
						</div>
					</form>
				</section>
			</main>
		</div>
	</body>
</html>
